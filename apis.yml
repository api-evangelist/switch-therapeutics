name: Switch Therapeutics
description: 'Switch Therapeutics is a precision neuroscience biotechnology company founded in 2020 and
  based in San Francisco, California, developing biomarker-gated genetic medicines for central nervous
  system (CNS) diseases with high unmet need. Its Conditionally Activated siRNA (CASi) platform combines
  properties of single- and double-stranded RNAs in one molecule to enable efficient self-delivery,
  potent and durable gene knockdown, and cell-type/cell-state selectivity. Its lead development candidate
  is CASi-APOE, a liver-sparing APOE RNAi therapy. The company is backed by CRV and Insight Partners and
  is a therapeutics developer with no public developer API, SDK, or technical documentation surface.'
